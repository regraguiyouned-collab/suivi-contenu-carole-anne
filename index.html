<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Suivi du contenu · Carole-Anne</title>
<link rel="stylesheet" href="polices.css">
<style>
:root{
  --encre:#242424; --gris:#7A7075; --gris-c:#A39A9E; --trait:#ECE6E0; --fond-col:#F7F4F1;
  --rouge:#FF385C; --rouge-f:#D81E44; --rose:#FFE5E8; --violet:#6D4FD3; --violet-pale:#EEE9FB; --creme:#FBF6EF;
  --f-titre:"Chewy","Nunito",system-ui,sans-serif;
  --f-corps:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:#fff;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--encre);font-family:var(--f-corps);font-size:15px;line-height:1.4}
a{color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px}

/* En-tête façon page */
.photo{width:64px;height:64px;border-radius:10px;background:var(--avatar) center 20%/cover #eee}
h1{font-family:var(--f-titre);font-weight:400;font-size:34px;line-height:1.05;margin:12px 0 4px}
.liens{font-size:13px;color:var(--gris);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.liens a{color:var(--gris);text-decoration:underline;text-underline-offset:2px}
.liens .sep{color:var(--gris-c)}
.maj{font-size:12.5px;color:var(--gris-c);margin-top:4px}
.ex{display:inline-block;margin-left:6px;background:var(--encre);color:#fff;border-radius:5px;padding:0 6px;font-size:11px;font-weight:800}
hr{border:0;border-top:1px solid var(--trait);margin:16px 0}

/* Chiffres en une ligne */
.stats{display:flex;flex-wrap:wrap;gap:6px}
.st{display:flex;align-items:baseline;gap:6px;background:var(--fond-col);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--gris)}
.st b{font-size:17px;color:var(--encre);font-weight:900}
.st.alerte{background:var(--rose);color:var(--rouge-f)}
.st.alerte b{color:var(--rouge-f)}
.st.moi{background:var(--violet-pale);color:var(--violet)}
.st.moi b{color:var(--violet)}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;font-weight:800;color:var(--gris)}
.legende span{display:flex;align-items:center;gap:6px}
.legende i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Onglets de vue */
.vues{display:flex;gap:0;margin:22px 0 0;border-bottom:1px solid var(--trait);overflow-x:auto;scrollbar-width:none}
.vues a{white-space:nowrap;flex:none;text-decoration:none;padding:8px 10px;font-weight:800;font-size:14.5px;color:var(--gris);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.vues a.on{color:var(--encre);border-color:var(--encre)}
.vues .b.moi{background:var(--violet)}
.vues .b{background:var(--rouge);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px}
section{display:none}
section.on{display:block}
h2{font-size:17px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:700;color:var(--gris-c);font-size:13px}

/* Tableau (colonnes par statut) */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;-webkit-overflow-scrolling:touch;margin:0 -20px;padding-left:20px;padding-right:20px}
.col{flex:0 0 232px;border-radius:10px;padding:8px;background:var(--fond-col)}
.col-h{display:flex;align-items:center;gap:6px;margin:0 2px 8px;font-size:12.5px}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-weight:800;font-size:12px;white-space:nowrap}
.col-h .n{color:var(--gris-c);font-weight:800}
.col-h .chez{margin-left:auto;font-size:11px;font-weight:900}
.rouge .chez{color:var(--rouge-f)}.violet .chez{color:var(--violet)}
.carte{display:block;text-decoration:none;background:#fff;border-radius:8px;box-shadow:0 0 0 1px rgba(36,36,36,.07),0 1px 2px rgba(36,36,36,.06);padding:9px 10px;margin:0 0 7px}
.carte:last-child{margin-bottom:0}
a.carte:hover{background:#FDFBF9}
.carte .t{font-weight:800;font-size:13.5px;line-height:1.3;margin:0 0 6px}
.carte .tags{display:flex;flex-wrap:wrap;gap:4px}
.carte .tag{font-size:11px;font-weight:800;border-radius:4px;padding:0 6px;background:#EFEAE5;color:#5C5357}
.carte .t::after{content:''}
a.carte .t::after{content:' ↗';color:var(--gris)}
.carte .m{font-size:11.5px;color:var(--gris);margin-top:6px}
.vide{font-size:12.5px;color:var(--gris-c);padding:4px}

/* Code couleur : rouge = chez Lara / Carole-Anne, violet = chez Younes, gris = rien à faire */
.rouge{background:#FDEEEF}.rouge .pill{background:var(--rose);color:var(--rouge-f)}
.violet{background:#F5F2FD}.violet .pill{background:var(--violet-pale);color:var(--violet)}
.neutre{background:var(--fond-col)}.neutre .pill{background:#E4E1DE;color:#5C5357}

/* Calendrier */
.cal-h{display:flex;align-items:center;gap:8px;margin:28px 0 10px}
.cal-h h2{margin:0;flex:1}
.cal-h button{font:inherit;font-weight:800;font-size:13px;border:1px solid var(--trait);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--encre)}
.grille{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--trait);border-left:1px solid var(--trait)}
.jn{font-size:11.5px;color:var(--gris-c);font-weight:800;text-align:center;padding:4px 0;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.case{min-height:96px;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait);padding:4px;min-width:0;cursor:default}
.case.hors{background:#FAF8F6}
.case.hors .num{color:var(--gris-c)}
.case.we{background:#FCFAF8}
.num{text-align:right;font-size:12px;font-weight:800;color:var(--gris);margin-bottom:3px}
.case.auj .num span{background:var(--encre);color:#fff;border-radius:999px;padding:1px 6px}
.ev{display:block;text-decoration:none;font-size:11.5px;font-weight:800;line-height:1.25;border-radius:4px;padding:3px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.reel,.ev.carr{background:#EFEAE5;color:var(--encre)}
.ev.pub{opacity:.55}
.case{cursor:pointer}
.case:hover{background:#FDFBF9}
.case.sel{outline:2px solid var(--encre);outline-offset:-2px}
.ev::after{content:' ↗'}
.detail{display:none;margin-top:10px;background:var(--fond-col);border-radius:10px;padding:10px 12px;font-size:14px}
.detail.on{display:block}
.detail .d{font-weight:900;margin-bottom:4px}
.detail .d::first-letter{text-transform:uppercase}
.detail a,.detail div.it{display:block;padding:6px 0;font-weight:700;text-decoration:none}
.detail a:hover{text-decoration:underline}
@media (max-width:560px){
  .case{min-height:58px;padding:3px;cursor:pointer}
  .num{text-align:center}
  .ev{font-size:0;height:6px;padding:0;margin:3px auto 0;width:70%;border-radius:3px}
  .case.sel{outline:2px solid var(--encre);outline-offset:-2px}
  h1{font-size:30px}
}

/* Tâches */
.taches{max-width:640px}
.tache .go{color:var(--gris);font-weight:900;text-decoration:none;display:inline-block}
a.tache{color:inherit;text-decoration:none}
a.tache:hover .t{text-decoration:underline}
.tache{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--trait)}
.ck{flex:none;width:17px;height:17px;border-radius:4px;border:1.5px solid #BDB3AA;position:relative}
.tache.fait .ck{background:#2E8B57;border-color:#2E8B57}
.tache.fait .ck::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tache .t{flex:1;font-weight:700}
.tache.fait .t{color:var(--gris-c);text-decoration:line-through}
.tache .dl{font-size:12.5px;color:var(--gris);font-weight:800}
.tache .ck{border-color:var(--violet)}
.tache.retard .t,.tache.retard .dl{color:var(--violet);font-weight:900}
.tache.retard .ck{border-color:var(--violet);background:var(--violet-pale)}

/* Fiche d'un contenu */
.carte{cursor:pointer}
.carte[draggable=true]{cursor:grab}
.col.drop{outline:2px dashed var(--encre);outline-offset:-2px}
.voile{position:fixed;inset:0;background:rgba(36,36,36,.35);display:none;z-index:20;align-items:flex-end;justify-content:center}
.voile.on{display:flex}
@media (min-width:700px){.voile{align-items:center}}
.fiche{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
@media (min-width:700px){.fiche{border-radius:16px}}
.fiche .haut{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--gris);font-weight:800}
.fiche .x{border:0;background:var(--fond-col);border-radius:999px;width:32px;height:32px;font-size:18px;cursor:pointer}
.fiche h3{font-size:20px;line-height:1.25;margin:10px 0 10px;font-weight:900}
.fiche .ligne{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.fiche .note{font-size:14px;color:var(--gris);margin:0 0 14px}
.fiche .bt{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border-radius:12px;font:inherit;font-weight:900;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--trait);background:#fff;color:var(--encre);margin:0 0 8px}
.fiche .bt.noir{background:var(--encre);color:#fff;border-color:var(--encre)}
.fiche .bt[disabled]{opacity:.45;cursor:not-allowed}
.fiche .deux{display:flex;gap:8px}.fiche .deux .bt{flex:1}
.fiche .petit{font-size:12.5px;color:var(--gris-c);margin-top:6px}
.fiche .hist{font-size:12.5px;color:var(--gris);margin-top:12px;border-top:1px solid var(--trait);padding-top:10px}
.fiche .qui-btn{display:flex;gap:8px;flex-wrap:wrap}.fiche .qui-btn .bt{flex:1;min-width:120px}
.pc-rouge{background:var(--rose);color:var(--rouge-f)}.pc-violet{background:var(--violet-pale);color:var(--violet)}.pc-neutre{background:#E4E1DE;color:#5C5357}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--encre);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:30;display:none}
.toast.on{display:block}
.pied{margin-top:40px;font-size:12.5px;color:var(--gris-c)}
</style>
</head>
<body>
<main class="wrap">
  <div class="photo"></div>
  <h1>Contenu Carole-Anne</h1>
  <div class="liens" id="liens"></div>
  <div class="maj" id="maj"></div>
  <hr>
  <div class="stats" id="stats"></div>
  <div class="legende"><span><i style="background:var(--rouge)"></i>Rouge : à faire de votre côté</span><span><i style="background:var(--violet)"></i>Violet : de mon côté</span></div>
  <nav class="vues" id="vues"></nav>
  <div id="app"></div>
  <div class="voile" id="voile"><div class="fiche" id="fiche"></div></div>
  <div class="toast" id="toast"></div>
  <p class="pied">Cliquez sur une carte pour l'ouvrir et la faire avancer.</p>
</main>

<script>
(async function(){
  const app=document.getElementById('app');
  let data;
  try{ data=await (await fetch('donnees.json',{cache:'no-store'})).json(); }
  catch(e){ app.innerHTML='<p>Impossible de charger les données. Réessayez.</p>'; return; }

  /* Dates (heure de Paris) */
  const AUJ=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const D=iso=>new Date(iso+'T12:00:00Z');
  const plus=(iso,n)=>{const d=D(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
  const fmt=(iso,o)=>new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',...o}).format(D(iso));
  const court=iso=>iso?fmt(iso,{day:'numeric',month:'short'}):'';
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const toast=t=>{const e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2600);};

  /* En-tête */
  document.getElementById('liens').innerHTML=(data.liens_rapides||[]).map(l=>l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.nom)}</a>`:`<span>${esc(l.nom)}</span>`).join('<span class="sep">|</span>');
  if(data.derniere_mise_a_jour){
    const [d,h]=data.derniere_mise_a_jour.split('T'); const [hh,mm]=(h||'').split(':');
    document.getElementById('maj').innerHTML='Dernière mise à jour : '+fmt(d,{day:'numeric',month:'long'})+(hh?' à '+parseInt(hh,10)+' h '+mm:'')+(data.donnees_exemple?'<span class="ex">EXEMPLE</span>':'');
  }

  const QUI=data.qui_doit_agir||{}, R=data.regles||{}, STS=data.statuts||{};
  const MIN_C=R.carrousels_programmes_minimum??10, MIN_R=R.reels_en_attente_minimum??15;
  const C=(data.contenus||[]).filter(x=>!x.retire);
  const T=(data.taches||[]).filter(t=>!t.retire && !(t.fait && (t.fait_le||t.deadline) && (t.fait_le||t.deadline) < plus(AUJ,-7)));
  const parId=Object.fromEntries(C.map(x=>[x.id,x]));
  const quiDe=st=>QUI[st]||(['Programmé','Prêt','Publié'].includes(st)?'':'Younes');
  const couleur=st=>{const q=quiDe(st); return q==='Younes'?'violet':(q?'rouge':'neutre');};

  /* Déplacements faits sur la page (script Google) */
  const URL_DEP=data.url_deplacements||'';
  const appliquer=m=>{const x=parId[m.id]; if(!x||!m.vers||x.statut===m.vers) return; x.statut=m.vers; (x.historique=x.historique||[]).push({statut:m.vers,le:String(m.date||'').slice(0,10),par:m.qui});};
  if(URL_DEP){
    try{
      const r=await (await fetch(URL_DEP+'?action=liste',{cache:'no-store'})).json();
      const depuis=data.deplacements_lus_jusqu_a||'';
      (r.deplacements||[]).filter(m=>String(m.date)>depuis).forEach(appliquer);
    }catch(e){}
  }
  let qui=''; try{ qui=localStorage.getItem('suivi-qui')||''; }catch(e){}

  /* Tableau par statut */
  const mois={};
  const tableau=(fmtNom,liste)=>{
    const sts=STS[fmtNom]||[];
    return `<div class="board">`+sts.map(st=>{
      const items=liste.filter(x=>x.statut===st).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
      if(st==='Publié') items.reverse();
      const q=quiDe(st);
      return `<div class="col ${couleur(st)}" data-st="${esc(st)}" data-fmt="${esc(fmtNom)}"><div class="col-h"><span class="pill">${esc(st)}</span><span class="n">${items.length}</span>${q?`<span class="chez">chez ${esc(q)}</span>`:''}</div>`+
        (items.length?items.map(x=>`<div class="carte" data-id="${esc(x.id)}" draggable="true"><div class="t">${esc(x.titre)}</div><div class="tags"><span class="tag">${esc(x.format)}</span>${x.date?`<span class="tag">${court(x.date)}</span>`:''}</div>${x.note?`<div class="m">${esc(x.note)}</div>`:''}</div>`).join(''):'<div class="vide">Vide</div>')+`</div>`;
    }).join('')+`</div>`;
  };

  /* Calendrier par format */
  const calendrier=(id,liste)=>{
    const m=mois[id]||AUJ.slice(0,7);
    const premier=m+'-01';
    const debut=plus(premier,-((D(premier).getUTCDay()+6)%7));
    const avecDate=liste.filter(x=>x.date);
    let g=['lun','mar','mer','jeu','ven','sam','dim'].map(j=>`<div class="jn">${j}</div>`).join('');
    for(let i=0;i<42;i++){
      const j=plus(debut,i);
      if(i%7===0 && i>=28 && j.slice(0,7)!==m) break;
      const ev=avecDate.filter(x=>x.date===j);
      const cls=[j.slice(0,7)!==m?'hors':'', j===AUJ?'auj':'', i%7>=5?'we':''].join(' ');
      g+=`<div class="case ${cls}" data-j="${j}"><div class="num"><span>${parseInt(j.slice(8),10)}</span></div>`+
        ev.map(x=>`<span class="ev ${x.format==='Réel'?'reel':'carr'} ${x.statut==='Publié'?'pub':''}" data-id="${esc(x.id)}" title="${esc(x.titre)}">${esc(x.titre)}${x.statut==='Publié'?' ✓':''}</span>`).join('')+`</div>`;
    }
    return `<div class="cal-h"><h2>Calendrier <small>${fmt(premier,{month:'long',year:'numeric'})}</small></h2><button data-cal="${id}" data-d="-1">‹</button><button data-cal="${id}" data-d="0">Aujourd'hui</button><button data-cal="${id}" data-d="1">›</button></div>
      <div class="grille" data-grille="${id}">${g}</div><div class="detail" data-detail="${id}"></div>`;
  };

  /* Tout ce qui se recalcule (chiffres, onglets, vue) */
  let VUES=[];
  const tout=()=>{
    const carr=C.filter(x=>x.format==='Carrousel'), reels=C.filter(x=>x.format==='Réel');
    const nb=(l,s)=>l.filter(x=>x.statut===s).length;
    const nProg=nb(carr,'Programmé'), nPret=nb(reels,'Prêt'), nCV=nb(carr,'À valider');
    const ri=nb(reels,'Idée à valider'), rs=nb(reels,'Script à valider'), rt=nb(reels,'À tourner'), nAtt=ri+rs+rt;
    const cChezEux=nb(carr,'Idée à valider')+nCV, cChezMoi=nb(carr,'Idée à faire')+nb(carr,'À créer');
    let progCls='', progTxt='';
    if(nProg<MIN_C){
      if(cChezMoi){ progCls='moi'; progTxt=` · ${cChezMoi} en cours de mon côté`; }
      else if(cChezEux){ progCls='alerte'; progTxt=` · la suite attend votre validation (${cChezEux})`; }
      else { progCls='moi'; progTxt=' · je prépare un nouveau lot'; }
    }
    document.getElementById('stats').innerHTML=`
      <div class="st ${progCls}"><b>${nProg}</b> carrousel${nProg>1?'s':''} programmé${nProg>1?'s':''}${progTxt}</div>
      <div class="st"><b>${nPret}</b> réel${nPret>1?'s':''} prêt${nPret>1?'s':''}</div>
      <div class="st ${nAtt?'alerte':''}"><b>${nAtt}</b> réels chez vous <span>(${ri} idées, ${rs} scripts, ${rt} à tourner)</span></div>${nAtt<MIN_R?`<div class="st moi">moins de ${MIN_R} : je prépare d'autres idées de réels</div>`:''}
      <div class="st ${nCV?'alerte':''}"><b>${nCV}</b> carrousel${nCV>1?'s':''} à valider</div>`;
    const nRet=T.filter(t=>!t.fait&&t.deadline&&t.deadline<AUJ).length;
    const taches=()=>`<h2>Mes tâches</h2><div class="taches">`+[...T].sort((a,b)=>(a.fait-b.fait)||(a.deadline||'').localeCompare(b.deadline||'')).map(t=>{
      const ret=!t.fait&&t.deadline&&t.deadline<AUJ;
      const inner=`<span class="ck"></span><span class="t">${esc(t.tache)}${t.lien?' <span class="go">↗</span>':''}</span><span class="dl">${t.fait?'fait':(ret?'en retard · ':'')+court(t.deadline)}</span>`;
      return t.lien?`<a class="tache ${t.fait?'fait':''} ${ret?'retard':''}" href="${esc(t.lien)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="tache ${t.fait?'fait':''} ${ret?'retard':''}">${inner}</div>`;
    }).join('')+(T.length?'':'<p class="vide">Aucune tâche pour l\'instant.</p>')+`</div>`;
    VUES=[
      {id:'reels',nom:'Réels',badge:ri+rs+rt,html:()=>`<h2>Réels <small>${reels.length}</small></h2>${tableau('Réel',reels)}${calendrier('reels',reels)}`},
      {id:'carrousels',nom:'Carrousels',badge:cChezEux,html:()=>`<h2>Carrousels <small>${carr.length}</small></h2>${tableau('Carrousel',carr)}${calendrier('carrousels',carr)}`},
      {id:'taches',nom:'Mes tâches',badge:nRet,moi:true,html:taches},
    ];
    document.getElementById('vues').innerHTML=VUES.map(v=>`<a href="#${v.id}" data-v="${v.id}">${v.nom}${v.badge?`<span class="b ${v.moi?'moi':''}">${v.badge}</span>`:''}</a>`).join('');
    rendre();
  };
  const rendre=()=>{
    const id=(location.hash||'').slice(1); const v=VUES.find(x=>x.id===id)||VUES[0];
    document.querySelectorAll('.vues a').forEach(a=>a.classList.toggle('on',a.dataset.v===v.id));
    const sc=[...app.querySelectorAll('.board')].map(b=>b.scrollLeft);
    app.innerHTML=`<section class="on">${v.html()}</section>`;
    app.querySelectorAll('.board').forEach((b,i)=>{ if(sc[i]) b.scrollLeft=sc[i]; });
  };

  /* Déplacer une carte */
  const deplacer=async(x,vers)=>{
    if(!x||!vers||x.statut===vers) return;
    if(!URL_DEP){ toast('Les déplacements ne sont pas encore branchés'); return; }
    if(!qui){ ouvrirFiche(x,vers); return; }
    const de=x.statut;
    const m={id:x.id,titre:x.titre,format:x.format,de,vers,qui,date:new Date().toISOString()};
    appliquer(m); tout(); fermer(); toast(`« ${x.titre.slice(0,40)} » → ${vers}`);
    try{ await fetch(URL_DEP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(m)}); }
    catch(e){ toast('Pas enregistré : vérifiez la connexion'); }
  };

  /* Fiche */
  const voile=document.getElementById('voile'), fiche=document.getElementById('fiche');
  const fermer=()=>voile.classList.remove('on');
  const ouvrirFiche=(x,versDemande)=>{
    const sts=STS[x.format]||[]; const i=sts.indexOf(x.statut);
    const prec=i>0?sts[i-1]:'', suiv=i>=0&&i<sts.length-1?sts[i+1]:'';
    const q=quiDe(x.statut);
    let bas;
    if(!URL_DEP){
      bas=`<div class="petit">Bientôt : avancer la carte d'ici.</div>`;
    }else if(!qui){
      bas=`<div class="petit" style="margin:4px 0 8px;font-weight:800;color:var(--encre)">Avant de déplacer : qui êtes-vous ?</div><div class="qui-btn">${['Lara','Carole-Anne','Younes'].map(n=>`<button class="bt" data-qui="${n}" data-vers="${esc(versDemande||'')}">${n}</button>`).join('')}</div>`;
    }else{
      bas=`${suiv?`<button class="bt noir" data-vers="${esc(suiv)}">Passer en « ${esc(suiv)} » →</button>`:''}
        <div class="deux">${prec?`<button class="bt" data-vers="${esc(prec)}">← ${esc(prec)}</button>`:''}</div>
        <div class="petit">Vous êtes ${esc(qui)} · <a href="#" data-changer-qui>changer</a></div>`;
    }
    fiche.innerHTML=`<div class="haut"><span>${esc(x.format)} · ${esc(x.id)}</span><button class="x" data-fermer aria-label="Fermer">×</button></div>
      <h3>${esc(x.titre)}</h3>
      <div class="ligne"><span class="pill pc-${couleur(x.statut)}">${esc(x.statut)}</span>${q?`<span style="font-size:13px;font-weight:800;color:var(--gris)">chez ${esc(q)}</span>`:''}${x.date?`<span class="tag" style="font-size:12px;font-weight:800;background:#EFEAE5;border-radius:4px;padding:1px 6px">${x.statut==='Publié'?'publié le':'prévu le'} ${court(x.date)}</span>`:''}</div>
      ${x.note?`<p class="note">${esc(x.note)}</p>`:''}
      ${x.lien?`<a class="bt" href="${esc(x.lien)}" target="_blank" rel="noopener">${/docs\.google/.test(x.lien)?'Ouvrir le document':/business\.facebook/.test(x.lien)?'Ouvrir dans Business Suite':/instagram/.test(x.lien)?'Voir sur Instagram':'Ouvrir'} ↗</a>`:''}
      ${bas}
      ${(x.historique||[]).length?`<div class="hist">${x.historique.slice().reverse().slice(0,5).map(h=>`${esc(h.statut)} · ${h.le?court(h.le):''}${h.par?' · '+esc(h.par):''}`).join('<br>')}</div>`:''}`;
    fiche._x=x; voile.classList.add('on');
  };
  voile.addEventListener('click',e=>{
    if(e.target===voile||e.target.closest('[data-fermer]')){ fermer(); return; }
    if(e.target.closest('[data-changer-qui]')){ e.preventDefault(); qui=''; try{localStorage.removeItem('suivi-qui');}catch(_){} ouvrirFiche(fiche._x); return; }
    const bq=e.target.closest('[data-qui]');
    if(bq){ qui=bq.dataset.qui; try{localStorage.setItem('suivi-qui',qui);}catch(_){} if(bq.dataset.vers) deplacer(fiche._x,bq.dataset.vers); else ouvrirFiche(fiche._x); return; }
    const bv=e.target.closest('button[data-vers]');
    if(bv) deplacer(fiche._x,bv.dataset.vers);
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') fermer(); });

  /* Clics dans la page */
  app.addEventListener('click',e=>{
    const b=e.target.closest('button[data-cal]');
    if(b){ const id=b.dataset.cal, d=+b.dataset.d; const cur=mois[id]||AUJ.slice(0,7);
      if(d===0) mois[id]=AUJ.slice(0,7); else { const x=D(cur+'-15'); x.setUTCMonth(x.getUTCMonth()+d); mois[id]=x.toISOString().slice(0,7); }
      rendre(); return; }
    const k=e.target.closest('[data-id]');
    if(k && parId[k.dataset.id]){ ouvrirFiche(parId[k.dataset.id]); return; }
    const c=e.target.closest('.case');
    if(c){
      const grille=c.parentElement, id=grille.dataset.grille;
      grille.querySelectorAll('.case.sel').forEach(x=>x.classList.remove('sel')); c.classList.add('sel');
      const liste=C.filter(x=>x.format===(id==='reels'?'Réel':'Carrousel')&&x.date===c.dataset.j);
      const det=app.querySelector(`[data-detail="${id}"]`); det.classList.add('on');
      det.innerHTML=`<div class="d">${fmt(c.dataset.j,{weekday:'long',day:'numeric',month:'long'})}</div>`+
        (liste.length?liste.map(x=>`<a href="#" data-id="${esc(x.id)}" onclick="return false">${esc(x.titre)} · <span style="color:var(--gris)">${esc(x.statut)}</span> ›</a>`).join(''):'<div class="it" style="color:var(--gris)">Rien de prévu ce jour-là.</div>');
    }
  });

  /* Glisser une carte vers une autre colonne (ordinateur) */
  app.addEventListener('dragstart',e=>{ const k=e.target.closest('.carte'); if(k){ e.dataTransfer.setData('text/plain',k.dataset.id); e.dataTransfer.effectAllowed='move'; } });
  app.addEventListener('dragover',e=>{ const col=e.target.closest('.col'); if(col){ e.preventDefault(); app.querySelectorAll('.col.drop').forEach(c=>c!==col&&c.classList.remove('drop')); col.classList.add('drop'); } });
  app.addEventListener('dragleave',e=>{ const col=e.target.closest('.col'); if(col&&!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
  app.addEventListener('drop',e=>{ const col=e.target.closest('.col'); if(!col) return; e.preventDefault(); col.classList.remove('drop');
    const x=parId[e.dataTransfer.getData('text/plain')]; if(x && x.format===col.dataset.fmt) deplacer(x,col.dataset.st); });

  window.addEventListener('hashchange',rendre);
  tout();
})();
</script>
</body>
</html>
