<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Suivi du contenu · Carole-Anne</title>
<link rel="stylesheet" href="polices.css">
<style>
:root{
  --encre:#242424; --gris:#7A7075; --trait:#EFE7DD; --rouge:#FF385C; --rouge-f:#D81E44;
  --rose:#FFE5E8; --bleu:#DDF1F2; --bleu-f:#16767B; --creme:#FBF6EF; --vert:#2E8B57;
  --f-titre:"Chewy","Nunito",system-ui,sans-serif;
  --f-corps:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--creme);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--encre);font-family:var(--f-corps);font-size:16px;line-height:1.4}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:22px 18px 60px}

/* En-tête */
.haut{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--avatar) center 20%/cover #eee;flex:none}
h1{font-family:var(--f-titre);font-weight:400;font-size:30px;line-height:1;margin:0}
.maj{color:var(--gris);font-size:13px;font-weight:700;margin-top:3px}
.ex{display:inline-block;margin-left:6px;background:var(--encre);color:#fff;border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:800;vertical-align:1px}

/* Onglets */
nav{position:sticky;top:0;z-index:5;background:var(--creme);margin:18px -18px 0;padding:8px 14px;display:flex;gap:0;justify-content:space-between;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--trait)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;font-weight:800;font-size:14px;color:var(--gris);padding:7px 9px;border-radius:999px;display:flex;align-items:center;gap:6px}
nav a.on{background:var(--encre);color:#fff}
nav a .b{width:7px;height:7px;border-radius:50%;background:var(--rouge)}

section{display:none;padding-top:18px}
section.on{display:block}
h2{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);margin:22px 0 8px}
h2:first-child{margin-top:4px}

/* Chiffres */
.chiffres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{background:#fff;border-radius:14px;padding:12px 14px}
.ch .n{font-family:var(--f-titre);font-size:38px;line-height:1}
.ch .l{font-size:13.5px;font-weight:800;margin-top:4px;line-height:1.25}
.ch .s{font-size:12.5px;color:var(--gris);margin-top:2px;line-height:1.3}
.ch.alerte .n,.ch.alerte .s{color:var(--rouge-f)}

/* Listes */
.liste{background:#fff;border-radius:14px;padding:2px 14px}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--trait);text-decoration:none}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .t{font-weight:800;font-size:15px;line-height:1.3}
.li .m{font-size:12.5px;color:var(--gris);margin-top:1px}
.li .go{flex:none;color:var(--rouge);font-weight:900;font-size:18px}
.pt{flex:none;width:9px;height:9px;border-radius:50%;background:var(--rouge)}
.pt.reel{background:var(--bleu-f)}
.grp{font-size:14px;font-weight:900;margin:16px 0 6px;display:flex;justify-content:space-between}
.grp span{color:var(--gris);font-weight:800}
.qui{font-family:var(--f-titre);font-weight:400;font-size:22px;margin:22px 0 2px}
.qui:first-of-type{margin-top:6px}
.rien{color:var(--gris);font-size:14px;padding:12px 0}

/* Semaine */
.jour{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--trait)}
.jour:first-child{border-top:0}
.jour .d{flex:none;width:56px;font-weight:900;font-size:14px;line-height:1.15;text-transform:capitalize}
.jour .d small{display:block;font-weight:700;color:var(--gris);font-size:12px;text-transform:none}
.jour.auj .d{color:var(--rouge-f)}
.jour .t{font-weight:800;font-size:14.5px;line-height:1.3}
.jour .m{font-size:12.5px;color:var(--gris)}
.jour.passe{opacity:.55}
.jour .vide{color:var(--rouge-f);font-weight:800;font-size:14px}
.legende{display:flex;gap:14px;font-size:12.5px;color:var(--gris);font-weight:700;margin:8px 2px 0}
.legende span{display:flex;align-items:center;gap:5px}

/* Étapes (carrousels / réels) */
details{background:#fff;border-radius:14px;margin:0 0 6px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;font-weight:800;font-size:15px}
summary::-webkit-details-marker{display:none}
summary .n{color:var(--gris);font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
summary .n::after{content:"›";font-size:20px;line-height:1;transition:transform .15s}
details[open] summary .n::after{transform:rotate(90deg)}
summary .chez{font-size:11.5px;font-weight:900;color:var(--rouge-f);background:var(--rose);border-radius:6px;padding:1px 6px;margin-left:6px}
summary .chez.ca{color:var(--bleu-f);background:var(--bleu)}
details .liste{padding-top:0}
details .li:first-child{border-top:1px solid var(--trait)}

/* Tâches */
.tache{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--trait)}
.tache:first-child{border-top:0}
.case{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid #CFC4B8}
.tache.fait .case{background:var(--vert);border-color:var(--vert);position:relative}
.tache.fait .case::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tache .t{flex:1;font-weight:800;font-size:15px;line-height:1.3}
.tache.fait .t{color:var(--gris);font-weight:700;text-decoration:line-through}
.tache .dl{flex:none;font-size:12.5px;color:var(--gris);font-weight:800}
.tache.retard .t,.tache.retard .dl{color:var(--rouge-f)}
.tache.retard .case{border-color:var(--rouge)}

.bilan{background:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px}
.bilan p{margin:0 0 6px}.bilan p:last-child{margin:0}
.bilan b{font-weight:900}
.alerte-tx{color:var(--rouge-f);font-weight:800}
.pied{margin-top:36px;text-align:center;color:var(--gris);font-size:12.5px}
</style>
</head>
<body>
<main class="wrap">
  <header class="haut">
    <span class="avatar"></span>
    <div><h1>Suivi du contenu</h1><div class="maj" id="maj"></div></div>
  </header>
  <nav id="nav"></nav>
  <div id="app"></div>
  <p class="pied">Pour valider ou refuser : réponse sur WhatsApp.</p>
</main>

<script>
(async function(){
  const app = document.getElementById('app');
  let data;
  try{ data = await (await fetch('donnees.json',{cache:'no-store'})).json(); }
  catch(e){ app.innerHTML='<p class="rien">Impossible de charger les données. Réessayez.</p>'; return; }

  /* Dates (heure de Paris) */
  const AUJ = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const D = iso => new Date(iso+'T12:00:00Z');
  const plus = (iso,n) => { const d=D(iso); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
  const fmt = (iso,o) => new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',...o}).format(D(iso));
  const court = iso => iso ? fmt(iso,{weekday:'short',day:'numeric',month:'short'}) : '';
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if(data.derniere_mise_a_jour){
    const [d,h]=data.derniere_mise_a_jour.split('T'); const [hh,mm]=(h||'').split(':');
    document.getElementById('maj').innerHTML = 'Mis à jour le '+fmt(d,{day:'numeric',month:'long'})+(hh?' à '+parseInt(hh,10)+' h '+mm:'')+(data.donnees_exemple?'<span class="ex">EXEMPLE</span>':'');
  }

  const C=data.contenus||[], T=data.taches||[], QUI=data.qui_doit_agir||{}, R=data.regles||{};
  const MIN_C=R.carrousels_programmes_minimum??10, MIN_R=R.reels_en_attente_minimum??20;
  const carr=C.filter(x=>x.format==='Carrousel'), reels=C.filter(x=>x.format==='Réel');
  const nb=(l,s)=>l.filter(x=>x.statut===s).length;
  const pt = x => `<span class="pt ${x.format==='Réel'?'reel':''}"></span>`;
  const ligne = (x,meta) => {
    const m = meta ?? [x.date?court(x.date):'', x.note].filter(Boolean).join(' · ');
    const inner = `${pt(x)}<span class="tx"><div class="t">${esc(x.titre)}</div>${m?`<div class="m">${esc(m)}</div>`:''}</span>${x.lien?'<span class="go">↗</span>':''}`;
    return x.lien ? `<a class="li" href="${esc(x.lien)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="li">${inner}</div>`;
  };

  /* Chiffres */
  const nProg=nb(carr,'Programmé'), nPret=nb(reels,'Prêt'), nCV=nb(carr,'À valider');
  const ri=nb(reels,'Idée à valider'), rs=nb(reels,'Script à valider'), rt=nb(reels,'À tourner');
  const nAtt=ri+rs+rt, aC=nProg<MIN_C, aR=nAtt<MIN_R;

  /* Ce qui attend */
  const GR=[
    ['Lara','Carrousel','À valider','Carrousels à valider'],
    ['Lara','Carrousel','Idée à valider','Idées de carrousels'],
    ['Lara','Réel','Script à valider','Scripts de réels'],
    ['Lara','Réel','Idée à valider','Idées de réels'],
    ['Carole-Anne','Réel','À tourner','Réels à tourner'],
  ];
  const attendQui = qui => {
    const gs=GR.filter(g=>g[0]===qui).map(g=>({tit:g[3],items:C.filter(x=>x.format===g[1]&&x.statut===g[2])})).filter(g=>g.items.length);
    const tot=gs.reduce((s,g)=>s+g.items.length,0);
    let h=`<div class="qui">${qui} · ${tot}</div>`;
    if(!tot) return h+'<p class="rien">Rien en attente.</p>';
    gs.forEach(g=>{ h+=`<div class="grp">${g.tit}<span>${g.items.length}</span></div><div class="liste">${g.items.map(x=>ligne(x,x.date?'Prévu '+court(x.date):'')).join('')}</div>`; });
    return h;
  };
  const totAttente = GR.reduce((s,g)=>s+C.filter(x=>x.format===g[1]&&x.statut===g[2]).length,0);

  /* Semaine */
  const lundi = plus(AUJ, -((D(AUJ).getUTCDay()+6)%7));
  const prevu = x => x.date && ((x.format==='Carrousel'&&['Programmé','Publié','À valider','À créer'].includes(x.statut))||(x.format==='Réel'&&['Prêt','Publié'].includes(x.statut)));
  let sem='<div class="liste">';
  for(let i=0;i<7;i++){
    const j=plus(lundi,i), du=C.filter(x=>x.date===j&&prevu(x));
    const r=du.filter(x=>x.format==='Réel'), c=du.filter(x=>x.format==='Carrousel');
    const choisi = r[0]||c[0];
    let cont;
    if(!choisi) cont='<span class="vide">Rien de prévu</span>';
    else {
      const etat = choisi.statut==='Publié'?'Publié ✓':choisi.statut==='Programmé'||choisi.statut==='Prêt'?choisi.format:choisi.format+' · '+choisi.statut.toLowerCase();
      const extra = r.length&&c.length ? ' · carrousel à décaler' : '';
      cont=`<div class="tx"><div class="t">${esc(choisi.titre)}</div><div class="m">${esc(etat+extra)}</div></div>`;
    }
    sem+=`<div class="jour ${j===AUJ?'auj':j<AUJ?'passe':''}"><div class="d">${fmt(j,{weekday:'short'}).replace('.','')}<small>${j===AUJ?'auj.':fmt(j,{day:'numeric',month:'short'})}</small></div>${choisi?pt(choisi):''}${cont}</div>`;
  }
  sem+='</div><div class="legende"><span><i class="pt"></i>Carrousel</span><span><i class="pt reel"></i>Réel</span></div>';

  /* Bilan court */
  const fin=plus(lundi,6), dans=(d,a,b)=>d&&d>=a&&d<=b;
  const pub=C.filter(x=>x.statut==='Publié'&&dans(x.date,lundi,fin)).length;
  const avance=C.filter(x=>(x.historique||[]).some(e=>dans(e.le,lundi,fin)&&e.statut!=='Publié')).length;
  const tf=T.filter(t=>t.fait&&dans(t.fait_le||t.deadline,lundi,fin)).length;
  const prochaine=C.filter(x=>dans(x.date,plus(lundi,7),plus(lundi,13))&&prevu(x)).length;
  const alertes=[aC?'nouveau lot de carrousels':'', aR?'nouvelles idées de réels':''].filter(Boolean);
  const bilan=`<div class="bilan">
    <p><b>Cette semaine :</b> ${pub} publié${pub>1?'s':''}, ${avance} contenu${avance>1?'s':''} avancé${avance>1?'s':''}, ${tf} tâche${tf>1?'s':''} faite${tf>1?'s':''}.</p>
    <p><b>Semaine prochaine :</b> ${prochaine} contenu${prochaine>1?'s':''} déjà prévu${prochaine>1?'s':''}.${alertes.length?` <span class="alerte-tx">En préparation : ${alertes.join(' et ')}.</span>`:''}</p></div>`;

  /* Étapes */
  const etapes = (fmtNom,liste) => (data.statuts[fmtNom]||[]).map(st=>{
    const items=liste.filter(x=>x.statut===st).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
    if(st==='Publié') items.reverse();
    const q=QUI[st];
    return `<details${q?' open':''}><summary><span>${esc(st)}${q?`<span class="chez ${q==='Carole-Anne'?'ca':''}">${q}</span>`:''}</span><span class="n">${items.length}</span></summary>
      ${items.length?`<div class="liste">${items.map(x=>ligne(x)).join('')}</div>`:''}</details>`;
  }).join('');

  /* Tâches */
  const taches = '<div class="liste">'+[...T].sort((a,b)=>(a.fait-b.fait)||(a.deadline||'').localeCompare(b.deadline||'')).map(t=>{
    const ret=!t.fait&&t.deadline&&t.deadline<AUJ;
    return `<div class="tache ${t.fait?'fait':''} ${ret?'retard':''}"><span class="case"></span><span class="t">${esc(t.tache)}</span><span class="dl">${t.fait?'fait':(ret?'en retard · ':'')+court(t.deadline)}</span></div>`;
  }).join('')+'</div>';
  const nRet=T.filter(t=>!t.fait&&t.deadline&&t.deadline<AUJ).length;

  /* Onglets */
  const VUES=[
    {id:'accueil',nom:'Accueil',html:`
      <h2>En un coup d'œil</h2>
      <div class="chiffres">
        <div class="ch ${aC?'alerte':''}"><div class="n">${nProg}</div><div class="l">Carrousels programmés</div><div class="s">${aC?'Moins de '+MIN_C+' : nouveau lot en cours':'Assez d\'avance'}</div></div>
        <div class="ch"><div class="n">${nPret}</div><div class="l">Réels prêts</div><div class="s">Passent avant les carrousels</div></div>
        <div class="ch ${aR?'alerte':''}"><div class="n">${nAtt}</div><div class="l">Réels chez vous</div><div class="s">${ri} idées · ${rs} scripts · ${rt} à tourner</div></div>
        <div class="ch"><div class="n">${nCV}</div><div class="l">Carrousels à valider</div><div class="s">Envoyés sur WhatsApp</div></div>
      </div>
      <h2>Ce qui vous attend</h2>
      ${attendQui('Lara')}${attendQui('Carole-Anne')}`},
    {id:'semaine',nom:'Semaine',html:`<h2>Du ${fmt(lundi,{day:'numeric',month:'short'})} au ${fmt(fin,{day:'numeric',month:'short'})}</h2>${sem}<h2>Bilan</h2>${bilan}`},
    {id:'carrousels',nom:'Carrousels',html:`<h2>${carr.length} carrousels par étape</h2>${etapes('Carrousel',carr)}`},
    {id:'reels',nom:'Réels',html:`<h2>${reels.length} réels par étape</h2>${etapes('Réel',reels)}`},
    {id:'taches',nom:'Tâches',badge:nRet,html:`<h2>Mes tâches</h2>${taches}`},
  ];
  document.getElementById('nav').innerHTML=VUES.map(v=>`<a href="#${v.id}" data-v="${v.id}">${v.nom}${v.badge?'<span class="b"></span>':''}</a>`).join('');
  app.innerHTML=VUES.map(v=>`<section id="v-${v.id}">${v.html}</section>`).join('');
  const montre=()=>{
    const id=(location.hash||'').slice(1); const v=VUES.find(x=>x.id===id)?id:'accueil';
    document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
    document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  };
  window.addEventListener('hashchange',()=>{montre();window.scrollTo(0,0);});
  montre();
})();
</script>
</body>
</html>
