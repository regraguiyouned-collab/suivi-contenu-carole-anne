<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Suivi du contenu · Carole-Anne</title>
<link rel="stylesheet" href="polices.css">
<style>
:root{
  --encre:#242424; --gris:#7A7075; --gris-c:#A39A9E; --trait:#ECE6E0; --fond-col:#F7F4F1;
  --rouge:#FF385C; --rouge-f:#D81E44; --rose:#FFE5E8; --bleu:#DDF1F2; --bleu-f:#16767B; --creme:#FBF6EF;
  --f-titre:"Chewy","Nunito",system-ui,sans-serif;
  --f-corps:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:#fff;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--encre);font-family:var(--f-corps);font-size:15px;line-height:1.4}
a{color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px}

/* En-tête façon page */
.photo{width:64px;height:64px;border-radius:10px;background:var(--avatar) center 20%/cover #eee}
h1{font-family:var(--f-titre);font-weight:400;font-size:34px;line-height:1.05;margin:12px 0 4px}
.liens{font-size:13px;color:var(--gris);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.liens a{color:var(--gris);text-decoration:underline;text-underline-offset:2px}
.liens .sep{color:var(--gris-c)}
.maj{font-size:12.5px;color:var(--gris-c);margin-top:4px}
.ex{display:inline-block;margin-left:6px;background:var(--encre);color:#fff;border-radius:5px;padding:0 6px;font-size:11px;font-weight:800}
hr{border:0;border-top:1px solid var(--trait);margin:16px 0}

/* Chiffres en une ligne */
.stats{display:flex;flex-wrap:wrap;gap:6px}
.st{display:flex;align-items:baseline;gap:6px;background:var(--fond-col);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--gris)}
.st b{font-size:17px;color:var(--encre);font-weight:900}
.st.alerte{background:var(--rose);color:var(--rouge-f)}
.st.alerte b{color:var(--rouge-f)}

/* Onglets de vue */
.vues{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--trait)}
.vues a{text-decoration:none;padding:8px 12px;font-weight:800;font-size:14.5px;color:var(--gris);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.vues a.on{color:var(--encre);border-color:var(--encre)}
.vues .b{background:var(--rouge);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px}
section{display:none}
section.on{display:block}
h2{font-size:17px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:700;color:var(--gris-c);font-size:13px}

/* Tableau (colonnes par statut) */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;-webkit-overflow-scrolling:touch;margin:0 -20px;padding-left:20px;padding-right:20px}
.col{flex:0 0 232px;border-radius:10px;padding:8px;background:var(--fond-col)}
.col-h{display:flex;align-items:center;gap:6px;margin:0 2px 8px;font-size:12.5px}
.pill{display:inline-block;border-radius:5px;padding:1px 7px;font-weight:800;font-size:12px;white-space:nowrap}
.col-h .n{color:var(--gris-c);font-weight:800}
.col-h .chez{margin-left:auto;font-size:11px;font-weight:900;color:var(--gris)}
.carte{display:block;text-decoration:none;background:#fff;border-radius:8px;box-shadow:0 0 0 1px rgba(36,36,36,.07),0 1px 2px rgba(36,36,36,.06);padding:9px 10px;margin:0 0 7px}
.carte:last-child{margin-bottom:0}
a.carte:hover{background:#FDFBF9}
.carte .t{font-weight:800;font-size:13.5px;line-height:1.3;margin:0 0 6px}
.carte .tags{display:flex;flex-wrap:wrap;gap:4px}
.carte .tag{font-size:11px;font-weight:800;border-radius:4px;padding:0 6px;background:#EFEAE5;color:#5C5357}
.carte .m{font-size:11.5px;color:var(--gris);margin-top:6px}
.vide{font-size:12.5px;color:var(--gris-c);padding:4px}

/* Couleurs des statuts (façon étiquettes) */
.c0{background:#EEF3F8}.c0 .pill{background:#D6E4F2;color:#2D5B87}
.c1{background:#FDEEEF}.c1 .pill{background:var(--rose);color:var(--rouge-f)}
.c2{background:#F4F1FA}.c2 .pill{background:#E4DCF3;color:#5E479A}
.c3{background:#FDEEEF}.c3 .pill{background:var(--rose);color:var(--rouge-f)}
.c4{background:#FBF4E6}.c4 .pill{background:#F5E3BD;color:#8A5A0B}
.c5{background:#F2F5EE}.c5 .pill{background:#DCE8D0;color:#46682A}
.c6{background:#EAF6F1}.c6 .pill{background:#CBEBDD;color:#1E6B4C}
.c7{background:#F3F2F1}.c7 .pill{background:#E4E1DE;color:#5C5357}

/* Calendrier */
.cal-h{display:flex;align-items:center;gap:8px;margin:28px 0 10px}
.cal-h h2{margin:0;flex:1}
.cal-h button{font:inherit;font-weight:800;font-size:13px;border:1px solid var(--trait);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--encre)}
.grille{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--trait);border-left:1px solid var(--trait)}
.jn{font-size:11.5px;color:var(--gris-c);font-weight:800;text-align:center;padding:4px 0;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.case{min-height:96px;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait);padding:4px;min-width:0;cursor:default}
.case.hors{background:#FAF8F6}
.case.hors .num{color:var(--gris-c)}
.case.we{background:#FCFAF8}
.num{text-align:right;font-size:12px;font-weight:800;color:var(--gris);margin-bottom:3px}
.case.auj .num span{background:var(--rouge);color:#fff;border-radius:999px;padding:1px 6px}
.ev{display:block;text-decoration:none;font-size:11.5px;font-weight:800;line-height:1.25;border-radius:4px;padding:3px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.reel{background:var(--bleu);color:#0F5559}
.ev.carr{background:var(--rose);color:#A3102F}
.ev.pub{opacity:.55}
.detail{display:none}
@media (max-width:700px){
  .case{min-height:58px;padding:3px;cursor:pointer}
  .num{text-align:center}
  .ev{font-size:0;height:6px;padding:0;margin:3px auto 0;width:70%;border-radius:3px}
  .case.sel{outline:2px solid var(--encre);outline-offset:-2px}
  .detail{display:block;margin-top:10px;background:var(--fond-col);border-radius:10px;padding:10px 12px;font-size:14px}
  .detail .d{font-weight:900;margin-bottom:4px}
  .detail .d::first-letter{text-transform:uppercase}
  .detail a,.detail div.it{display:block;padding:4px 0;font-weight:700;text-decoration:none}
  h1{font-size:30px}
}

/* Tâches */
.taches{max-width:640px}
.tache{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--trait)}
.ck{flex:none;width:17px;height:17px;border-radius:4px;border:1.5px solid #BDB3AA;position:relative}
.tache.fait .ck{background:#2E8B57;border-color:#2E8B57}
.tache.fait .ck::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tache .t{flex:1;font-weight:700}
.tache.fait .t{color:var(--gris-c);text-decoration:line-through}
.tache .dl{font-size:12.5px;color:var(--gris);font-weight:800}
.tache.retard .t,.tache.retard .dl{color:var(--rouge-f)}
.tache.retard .ck{border-color:var(--rouge)}
.pied{margin-top:40px;font-size:12.5px;color:var(--gris-c)}
</style>
</head>
<body>
<main class="wrap">
  <div class="photo"></div>
  <h1>Contenu Carole-Anne</h1>
  <div class="liens" id="liens"></div>
  <div class="maj" id="maj"></div>
  <hr>
  <div class="stats" id="stats"></div>
  <nav class="vues" id="vues"></nav>
  <div id="app"></div>
  <p class="pied">Pour valider ou refuser : réponse sur WhatsApp.</p>
</main>

<script>
(async function(){
  const app=document.getElementById('app');
  let data;
  try{ data=await (await fetch('donnees.json',{cache:'no-store'})).json(); }
  catch(e){ app.innerHTML='<p>Impossible de charger les données. Réessayez.</p>'; return; }

  /* Dates (heure de Paris) */
  const AUJ=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const D=iso=>new Date(iso+'T12:00:00Z');
  const plus=(iso,n)=>{const d=D(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
  const fmt=(iso,o)=>new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',...o}).format(D(iso));
  const court=iso=>iso?fmt(iso,{day:'numeric',month:'short'}):'';
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* En-tête */
  document.getElementById('liens').innerHTML=(data.liens_rapides||[]).map(l=>l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.nom)}</a>`:`<span>${esc(l.nom)}</span>`).join('<span class="sep">|</span>');
  if(data.derniere_mise_a_jour){
    const [d,h]=data.derniere_mise_a_jour.split('T'); const [hh,mm]=(h||'').split(':');
    document.getElementById('maj').innerHTML='Dernière mise à jour : '+fmt(d,{day:'numeric',month:'long'})+(hh?' à '+parseInt(hh,10)+' h '+mm:'')+(data.donnees_exemple?'<span class="ex">EXEMPLE</span>':'');
  }

  const C=data.contenus||[], T=data.taches||[], QUI=data.qui_doit_agir||{}, R=data.regles||{};
  const MIN_C=R.carrousels_programmes_minimum??10, MIN_R=R.reels_en_attente_minimum??15;
  const carr=C.filter(x=>x.format==='Carrousel'), reels=C.filter(x=>x.format==='Réel');
  const nb=(l,s)=>l.filter(x=>x.statut===s).length;

  /* Chiffres */
  const nProg=nb(carr,'Programmé'), nPret=nb(reels,'Prêt'), nCV=nb(carr,'À valider');
  const ri=nb(reels,'Idée à valider'), rs=nb(reels,'Script à valider'), rt=nb(reels,'À tourner'), nAtt=ri+rs+rt;
  document.getElementById('stats').innerHTML=`
    <div class="st ${nProg<MIN_C?'alerte':''}"><b>${nProg}</b> carrousels programmés${nProg<MIN_C?' · nouveau lot en cours':''}</div>
    <div class="st"><b>${nPret}</b> réel${nPret>1?'s':''} prêt${nPret>1?'s':''}</div>
    <div class="st ${nAtt<MIN_R?'alerte':''}"><b>${nAtt}</b> réels chez vous <span>(${ri} idées, ${rs} scripts, ${rt} à tourner)</span></div>
    <div class="st"><b>${nCV}</b> carrousel${nCV>1?'s':''} à valider</div>`;

  /* Tableau par statut */
  const tableau=(fmtNom,liste)=>{
    const sts=(data.statuts||{})[fmtNom]||[];
    return `<div class="board">`+sts.map((st,i)=>{
      const items=liste.filter(x=>x.statut===st).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
      if(st==='Publié') items.reverse();
      const c='c'+(st==='Publié'?7:Math.min(i,6));
      const q=QUI[st];
      return `<div class="col ${c}"><div class="col-h"><span class="pill">${esc(st)}</span><span class="n">${items.length}</span>${q?`<span class="chez">chez ${esc(q)}</span>`:''}</div>`+
        (items.length?items.map(x=>{
          const inner=`<div class="t">${esc(x.titre)}</div><div class="tags"><span class="tag">${esc(x.format)}</span>${x.date?`<span class="tag">${court(x.date)}</span>`:''}</div>${x.note?`<div class="m">${esc(x.note)}</div>`:''}`;
          return x.lien?`<a class="carte" href="${esc(x.lien)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="carte">${inner}</div>`;
        }).join(''):'<div class="vide">Vide</div>')+`</div>`;
    }).join('')+`</div>`;
  };

  /* Calendrier par format */
  const mois={};
  const calendrier=(id,liste)=>{
    const m=mois[id]||AUJ.slice(0,7);
    const premier=m+'-01';
    const debut=plus(premier,-((D(premier).getUTCDay()+6)%7));
    const avecDate=liste.filter(x=>x.date);
    let g=['lun','mar','mer','jeu','ven','sam','dim'].map(j=>`<div class="jn">${j}</div>`).join('');
    for(let i=0;i<42;i++){
      const j=plus(debut,i);
      if(i%7===0 && i>=28 && j.slice(0,7)!==m) break;
      const ev=avecDate.filter(x=>x.date===j);
      const cls=[j.slice(0,7)!==m?'hors':'', j===AUJ?'auj':'', i%7>=5?'we':''].join(' ');
      g+=`<div class="case ${cls}" data-j="${j}"><div class="num"><span>${parseInt(j.slice(8),10)}</span></div>`+
        ev.map(x=>{const c=`ev ${x.format==='Réel'?'reel':'carr'} ${x.statut==='Publié'?'pub':''}`; const t=esc(x.titre)+(x.statut==='Publié'?' ✓':'');
          return x.lien?`<a class="${c}" href="${esc(x.lien)}" target="_blank" rel="noopener" title="${esc(x.titre)}">${t}</a>`:`<span class="${c}" title="${esc(x.titre)}">${t}</span>`;}).join('')+`</div>`;
    }
    const nom=fmt(premier,{month:'long',year:'numeric'});
    return `<div class="cal-h"><h2>Calendrier <small>${nom}</small></h2><button data-cal="${id}" data-d="-1">‹</button><button data-cal="${id}" data-d="0">Aujourd'hui</button><button data-cal="${id}" data-d="1">›</button></div>
      <div class="grille" data-grille="${id}">${g}</div><div class="detail" data-detail="${id}"></div>`;
  };

  /* Tâches */
  const nRet=T.filter(t=>!t.fait&&t.deadline&&t.deadline<AUJ).length;
  const taches=()=>`<h2>Mes tâches</h2><div class="taches">`+[...T].sort((a,b)=>(a.fait-b.fait)||(a.deadline||'').localeCompare(b.deadline||'')).map(t=>{
    const ret=!t.fait&&t.deadline&&t.deadline<AUJ;
    return `<div class="tache ${t.fait?'fait':''} ${ret?'retard':''}"><span class="ck"></span><span class="t">${esc(t.tache)}</span><span class="dl">${t.fait?'fait':(ret?'en retard · ':'')+court(t.deadline)}</span></div>`;
  }).join('')+(T.length?'':'<p class="vide">Aucune tâche pour l\'instant.</p>')+`</div>`;

  /* Vues */
  const attReels=ri+rs+rt, attCarr=nb(carr,'Idée à valider')+nCV;
  const VUES=[
    {id:'reels',nom:'Réels',badge:attReels,html:()=>`<h2>Réels <small>${reels.length}</small></h2>${tableau('Réel',reels)}${calendrier('reels',reels)}`},
    {id:'carrousels',nom:'Carrousels',badge:attCarr,html:()=>`<h2>Carrousels <small>${carr.length}</small></h2>${tableau('Carrousel',carr)}${calendrier('carrousels',carr)}`},
    {id:'taches',nom:'Mes tâches',badge:nRet,html:taches},
  ];
  document.getElementById('vues').innerHTML=VUES.map(v=>`<a href="#${v.id}" data-v="${v.id}">${v.nom}${v.badge?`<span class="b">${v.badge}</span>`:''}</a>`).join('');
  const rendre=()=>{
    const id=(location.hash||'').slice(1); const v=VUES.find(x=>x.id===id)||VUES[0];
    document.querySelectorAll('.vues a').forEach(a=>a.classList.toggle('on',a.dataset.v===v.id));
    app.innerHTML=`<section class="on">${v.html()}</section>`;
  };
  app.addEventListener('click',e=>{
    const b=e.target.closest('button[data-cal]');
    if(b){ const id=b.dataset.cal, d=+b.dataset.d; const cur=mois[id]||AUJ.slice(0,7);
      if(d===0) mois[id]=AUJ.slice(0,7); else { const x=D(cur+'-15'); x.setUTCMonth(x.getUTCMonth()+d); mois[id]=x.toISOString().slice(0,7); }
      rendre(); return; }
    const c=e.target.closest('.case');
    if(c && window.matchMedia('(max-width:700px)').matches){
      e.preventDefault();
      const grille=c.parentElement, id=grille.dataset.grille;
      grille.querySelectorAll('.case.sel').forEach(x=>x.classList.remove('sel')); c.classList.add('sel');
      const liste=(id==='reels'?reels:carr).filter(x=>x.date===c.dataset.j);
      app.querySelector(`[data-detail="${id}"]`).innerHTML=`<div class="d">${fmt(c.dataset.j,{weekday:'long',day:'numeric',month:'long'})}</div>`+
        (liste.length?liste.map(x=>x.lien?`<a href="${esc(x.lien)}" target="_blank" rel="noopener">${esc(x.titre)} · <span style="color:var(--gris)">${esc(x.statut)}</span> ↗</a>`:`<div class="it">${esc(x.titre)} · ${esc(x.statut)}</div>`).join(''):'<div class="it" style="color:var(--gris)">Rien de prévu ce jour-là.</div>');
    }
  });
  window.addEventListener('hashchange',rendre);
  rendre();
})();
</script>
</body>
</html>
